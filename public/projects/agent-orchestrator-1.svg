<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a18"/>
      <stop offset="1" stop-color="#0c0f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g font-family="monospace" fill="#e2e8f0">
    <text x="64" y="100" font-size="40" fill="#22d3ee">Agent Orchestrator</text>
    <text x="64" y="150" font-size="22" fill="#94a3b8">Control plane / run timeline</text>
  </g>
  <g transform="translate(64,210)">
    <rect width="360" height="120" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="24" y="48" font-family="monospace" font-size="20" fill="#e2e8f0">Planner Agent</text>
    <text x="24" y="84" font-family="monospace" font-size="16" fill="#22d3ee">status: running</text>
    <rect x="480" width="360" height="120" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="504" y="48" font-family="monospace" font-size="20" fill="#e2e8f0">Tool Executor</text>
    <text x="504" y="84" font-family="monospace" font-size="16" fill="#a855f7">queue: 3 tasks</text>
    <rect x="900" width="300" height="120" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="924" y="48" font-family="monospace" font-size="20" fill="#e2e8f0">Evaluator</text>
    <text x="924" y="84" font-family="monospace" font-size="16" fill="#3b82f6">pass rate 94%</text>
  </g>
  <g transform="translate(64,380)" font-family="monospace">
    <rect width="1136" height="280" rx="14" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="46" font-size="16" fill="#22d3ee">&gt; orchestrator.run(goal: summarize backlog)</text>
    <text x="24" y="86" font-size="16" fill="#94a3b8">  [planner] decomposed into 4 subtasks</text>
    <text x="24" y="126" font-size="16" fill="#94a3b8">  [executor] tool github.search returns 18 issues</text>
    <text x="24" y="166" font-size="16" fill="#94a3b8">  [executor] tool vector.retrieve returns 6 docs</text>
    <text x="24" y="206" font-size="16" fill="#94a3b8">  [evaluator] grounded PASS  hallucination FAIL</text>
    <text x="24" y="246" font-size="16" fill="#22d3ee">  [ok] run complete in 8.2s</text>
  </g>
