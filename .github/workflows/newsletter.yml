name: Weekly newsletter digest

# Primary send path (do not rely on Vercel Hobby cron alone — it went silent after Aug 18).
# Vercel `/api/cron/newsletter` at Tue 08:00 UTC is a backup; already_sent_this_week skips doubles.

on:
  schedule:
    # Tuesday 07:15 UTC — after news refresh (06:00) has a chance to land.
    - cron: "15 7 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: "Resend even if already sent this week"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Assemble digest and send
        id: send
        env:
          SLACK_ORBIT_WEBHOOK_URL: ${{ secrets.SLACK_ORBIT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEKLY_WRITE_SECRET: ${{ secrets.WEEKLY_WRITE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_NEWSLETTER_FROM: ${{ secrets.RESEND_NEWSLETTER_FROM }}
          RESEND_NEWSLETTER_AUDIENCE_ID: ${{ secrets.RESEND_NEWSLETTER_AUDIENCE_ID }}
          RESEND_NEWSLETTER_TEST_TO: ${{ secrets.RESEND_NEWSLETTER_TEST_TO }}
          RAVENS_GITHUB_TOKEN: ${{ secrets.RAVENS_GITHUB_TOKEN }}
          RAVENS_GITHUB_REPO: AlexTouvras/ravens
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          npx tsx src/scripts/newsletter.ts --notify $FORCE_FLAG

      - name: Fail loudly if send failed
        if: failure()
        env:
          SLACK_ORBIT_WEBHOOK_URL: ${{ secrets.SLACK_ORBIT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          WEBHOOK="${SLACK_ORBIT_WEBHOOK_URL:-$SLACK_WEBHOOK_URL}"
          if [ -z "$WEBHOOK" ]; then
            echo "No Slack webhook; see Actions log."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Orbit weekly digest Actions job FAILED — check https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK" || true
