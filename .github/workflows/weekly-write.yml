name: Weekly Write draft

# Primary Monday writer: Cursor Cloud Automation (see .cursor/skills/weekly-write-essay).
# This workflow is manual-only — use workflow_dispatch to test intake + IDE brief locally.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Replace an existing pending draft"
        type: boolean
        default: false
      notify:
        description: "Post to Slack (#orbit webhook)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build intake + IDE brief (Cloud Automation writes the essay)
        env:
          SLACK_ORBIT_WEBHOOK_URL: ${{ secrets.SLACK_ORBIT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEKLY_WRITE_SECRET: ${{ secrets.WEEKLY_WRITE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          WEEKLY_WRITE_USE_CLOUD_AUTOMATION: "1"
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "Set repo variable NEXT_PUBLIC_SITE_URL (e.g. https://your-domain.com) so Approve links work."
            exit 1
          fi
          FORCE_FLAG=""
          NOTIFY_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          if [ "${{ inputs.notify }}" = "true" ]; then NOTIFY_FLAG="--notify"; fi
          npx tsx src/scripts/weekly-write.ts --once $FORCE_FLAG $NOTIFY_FLAG | tee /tmp/weekly-write-out.json
          if grep -q '"awaitingIde": true' /tmp/weekly-write-out.json; then
            echo "IDE brief written — finish essay in Cursor Cloud Automation."
            exit 0
          fi
          exit 0

      - name: Commit IDE brief if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/weekly-write-ide-brief.json data/weekly-write-ide-brief.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No IDE brief change."
            exit 0
          fi
          git commit -m "chore: weekly write IDE brief [skip ci] [skip vercel]"
          git push
